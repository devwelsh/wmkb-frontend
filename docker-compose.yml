services:
  wmkb-frontend:
    build: .
    image: viibeware/wmkb-frontend
    container_name: wmkb-frontend
    restart: unless-stopped
    ports:
      - "${WMKB_PORT:-5070}:5000"
    volumes:
      - wmkb-data:/data
    environment:
      - SECRET_KEY=${SECRET_KEY:-}
      - WMKB_DATA_DIR=/data
      - WMKB_SECURE_COOKIES=${WMKB_SECURE_COOKIES:-}
      # This deployment is documented as running behind a reverse proxy, so
      # X-Forwarded-* trust defaults on. Set to 0 if the port is exposed directly.
      - WMKB_BEHIND_PROXY=${WMKB_BEHIND_PROXY:-1}
      # Set to 1 to allow an http:// or loopback Warehouse Manager URL
      # (internal/dev deployments only — the default requires https).
      - WMKB_ALLOW_INTERNAL_WM=${WMKB_ALLOW_INTERNAL_WM:-}

  # Scheduled sync runs as its own process (no in-web-worker scheduler election).
  # Shares the same image, code, and data volume; it is the single DB writer for
  # KB content while the web workers are readers.
  wmkb-sync:
    build: .
    image: viibeware/wmkb-frontend
    container_name: wmkb-sync
    restart: unless-stopped
    command: ["python", "sync.py"]
    volumes:
      - wmkb-data:/data
    environment:
      - SECRET_KEY=${SECRET_KEY:-}
      - WMKB_DATA_DIR=/data
      - WMKB_ALLOW_INTERNAL_WM=${WMKB_ALLOW_INTERNAL_WM:-}
    depends_on:
      - wmkb-frontend

volumes:
  wmkb-data:
